name: OLX iPhone Bot

on:
  schedule:
    - cron: '*/5 * * * *'    # Every 5 minutes
    - cron: '0 7 * * *'      # Morning summary at 9:00 Sofia time (7:00 UTC)
  workflow_dispatch:
    inputs:
      morning_summary:
        description: 'Send morning summary now'
        required: false
        default: 'false'

concurrency:
  group: iphone-bot
  cancel-in-progress: false

jobs:
  check-listings:
    if: github.event.schedule != '0 7 * * *' && github.event.inputs.morning_summary != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run iPhone bot (loop for 4.5 min, check every 10s)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          LOOP_FOR_SECONDS: '270'
        run: python olx_iphone_bot.py

  morning-summary:
    if: github.event.schedule == '0 7 * * *' || github.event.inputs.morning_summary == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Send morning summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_MORNING_SUMMARY: 'true'
        run: python olx_iphone_bot.py
