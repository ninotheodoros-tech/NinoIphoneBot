name: OLX iPhone Bot

on:
  schedule:
    - cron: '*/5 * * * *'    # Every 5 minutes (GitHub minimum)
    - cron: '0 7 * * *'      # Morning summary at 9:00 Sofia time (7:00 UTC)
  workflow_dispatch:
    inputs:
      morning_summary:
        description: 'Send morning summary now'
        required: false
        default: 'false'

# CRITICAL: Only one run at a time. If a new run starts while one is running,
# wait for it to finish (don't cancel) — this prevents seen_listings conflicts.
concurrency:
  group: iphone-bot
  cancel-in-progress: false

jobs:
  check-listings:
    if: github.event.schedule != '0 7 * * *' && github.event.inputs.morning_summary != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Always pull latest so seen_listings.json is up to date
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run iPhone bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_C_USER: ${{ secrets.FB_C_USER }}
          FB_XS: ${{ secrets.FB_XS }}
        run: python olx_iphone_bot.py

      - name: Save seen listings back to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_listings.json best_deals.json 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: update listings data [skip ci]"
          git pull --rebase origin main
          git push

  morning-summary:
    if: github.event.schedule == '0 7 * * *' || github.event.inputs.morning_summary == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Send morning summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_MORNING_SUMMARY: 'true'
        run: python olx_iphone_bot.py
